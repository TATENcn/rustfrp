name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request direction
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "Only dev may be merged into main."
            exit 1
          fi
          if [ "$BASE_REF" = "dev" ] && [ "$HEAD_REF" = "main" ]; then
            echo "main must not be merged back into dev through a feature PR."
            exit 1
          fi

  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # rustfrp-daemon embeds this directory at compile time. Build it before
      # Clippy/tests so a clean checkout exercises the same inputs as release.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Build embedded WebUI prerequisite
        working-directory: plugins/webui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

  webui:
    name: WebUI quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        working-directory: plugins/webui
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: plugins/webui
        run: bun x tsc --noEmit

      - name: Check translations
        working-directory: plugins/webui
        run: bun scripts/check-i18n-keys.ts

      - name: Build embedded WebUI
        working-directory: plugins/webui
        run: bun run build
