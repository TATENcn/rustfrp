name: Platform builds

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/platform-build.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'plugins/webui/**'

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - working-directory: plugins/webui
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: platform-webui
          path: plugins/webui/dist/
          retention-days: 1

  build:
    needs: webui
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-vs2026-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: platform-webui
          path: plugins/webui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Build all shipped binaries
        run: cargo build --workspace --bins --release --target ${{ matrix.target }}
