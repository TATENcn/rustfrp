name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify-tag:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on main."
            exit 1
          }

  webui:
    name: Build embedded WebUI
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - name: Build frontend
        working-directory: plugins/webui
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: embedded-webui
          path: plugins/webui/dist/
          retention-days: 1

  build:
    needs: [verify-tag, webui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: rustfrp_linux_amd64
            archive: tar
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: rustfrp_linux_arm64
            archive: tar
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: rustfrp_windows_amd64
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-vs2026-arm
            artifact: rustfrp_windows_arm64
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: rustfrp_darwin_amd64
            archive: tar
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: rustfrp_darwin_arm64
            archive: tar

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: embedded-webui
          path: plugins/webui/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --workspace --bins --release --target ${{ matrix.target }}

      - name: Package Unix bundle
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/${{ matrix.artifact }}"
          mkdir -p "$bundle"
          for binary in rustfrp-daemon rustfrp-agent rustfrp-control; do
            cp "target/${{ matrix.target }}/release/$binary" "$bundle/"
          done
          cp README.md CHANGELOG.md LICENSE "$bundle/"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256")
          fi

      - name: Package Windows bundle
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          foreach ($binary in @('rustfrp-daemon', 'rustfrp-agent', 'rustfrp-control')) {
            Copy-Item "target/${{ matrix.target }}/release/$binary.exe" $bundle
          }
          Copy-Item README.md, CHANGELOG.md, LICENSE $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/${{ matrix.artifact }}.zip"
          $file = "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content -NoNewline "dist/$file.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  container:
    name: Publish multi-architecture container
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The multi-arch push runs arm64 under QEMU. On 2026-11-15 it pushed the image
    # and then hung in the build-push post-steps for 40+ minutes, which held the
    # whole release hostage. Bound it so a stuck push fails this job instead.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tatencn/rustfrp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build container for offline startup check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rustfrp:release-smoke
          cache-from: type=gha

      - name: Verify empty offline container serves API and frontend
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs rustfrp-offline-smoke; docker rm -f -v rustfrp-offline-smoke' EXIT
          # Override CMD intentionally: offline startup must be the binary default.
          docker run -d --name rustfrp-offline-smoke --network none \
            rustfrp:release-smoke --db-path /data/config.db \
            --config-dir /data/runtime --api-listen 0.0.0.0:7900
          for attempt in $(seq 1 20); do
            if docker exec rustfrp-offline-smoke curl -fsS http://127.0.0.1:7900/api/v1/health; then break; fi
            sleep 1
          done
          docker exec rustfrp-offline-smoke curl -fsS http://127.0.0.1:7900/api/v1/health
          docker exec rustfrp-offline-smoke sh -c \
            'curl -fsS http://127.0.0.1:7900/ -o /tmp/index.html && grep -q "<html" /tmp/index.html'

      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop bundle (${{ matrix.name }})
    needs: [verify-tag, webui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: rustfrp_desktop_linux_amd64
          # Tauri bundles cannot be cross-compiled: each platform runs its own
          # runner and produces its own installers.
          - name: windows-amd64
            os: windows-latest
            bundles: nsis,msi
            artifact: rustfrp_desktop_windows_amd64
          - name: darwin-amd64
            os: macos-15-intel
            bundles: dmg
            artifact: rustfrp_desktop_darwin_amd64
          - name: darwin-arm64
            os: macos-15
            bundles: dmg
            artifact: rustfrp_desktop_darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: embedded-webui
          path: plugins/webui/dist

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf libfuse2 file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            plugins/gui/src-tauri -> target
          key: desktop-${{ matrix.name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      # `tauri build` runs the `beforeBuildCommand`, which reinstalls and
      # rebuilds the WebUI; the artifact above only primes the cargo build of the
      # daemon crates that embed it.
      - name: Install shell dependencies
        working-directory: plugins/gui
        run: bun install --frozen-lockfile

      # Code signing is not wired yet, and an empty `APPLE_*` value is not the
      # same as an absent one: Tauri treats `APPLE_CERTIFICATE=""` as a real
      # certificate and fails decoding it. Adding these secrets later means
      # adding them here as well.
      - name: Build desktop bundles
        working-directory: plugins/gui
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            plugins/gui/src-tauri/target/release/bundle/deb/*.deb
            plugins/gui/src-tauri/target/release/bundle/appimage/*.AppImage
            plugins/gui/src-tauri/target/release/bundle/nsis/*.exe
            plugins/gui/src-tauri/target/release/bundle/msi/*.msi
            plugins/gui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    # `container` is deliberately absent: a stuck image push must not withhold
    # the installers and CLI archives from the release. The workflow still fails
    # overall, so a broken image stays visible.
    needs: [build, desktop]
    if: always() && needs.build.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \
            -o -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
          \) -exec cp {} . \;
          ls -la
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
            *.deb
            *.AppImage
            *.msi
            *.exe
            *.dmg
          generate_release_notes: true
