name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: rustfrp-daemon_linux_amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: rustfrp-daemon_linux_arm64
        # Windows/macOS 矩阵后续补充（需 Tauri/交叉编译链落地后）

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Build frontend (required for rust-embed)
        working-directory: plugins/webui
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain (aarch64 only)
        if: contains(matrix.target, 'aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build -p rustfrp-daemon --release --target ${{ matrix.target }}

      - name: Package and checksum
        run: |
          mkdir -p dist
          BIN=$(find target/${{ matrix.target }}/release -maxdepth 1 -name rustfrp-daemon -type f)
          cp "$BIN" dist/${{ matrix.artifact }}
          cd dist
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          rm ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} . \;
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
          generate_release_notes: true