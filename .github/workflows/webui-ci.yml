name: WebUI CI

on:
  push:
    paths:
      - 'plugins/webui/**'
      - 'crates/rustfrp-daemon/**'
      - '.github/workflows/webui-ci.yml'
  pull_request:
    paths:
      - 'plugins/webui/**'
      - 'crates/rustfrp-daemon/**'

jobs:
  frontend:
    name: Frontend Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/webui
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit

      - name: Check i18n keys
        run: bun scripts/check-i18n-keys.ts

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify build output
        run: test -f dist/index.html

  backend:
    name: Backend (daemon) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Build frontend (required for rust-embed)
        working-directory: plugins/webui
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Run daemon tests
        run: cargo test -p rustfrp-daemon

      - name: Build release binary
        run: cargo build -p rustfrp-daemon --release
