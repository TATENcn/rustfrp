[package]
name = "rustfrp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RustFRP client — frpc wrapper with config management, TOML generation, and process supervision"

[features]
default = []
jemalloc = ["tikv-jemallocator"]
mimalloc-dep = ["mimalloc"]

[dependencies]
rustfrp-common = { version = "0.2.0", path = "../common" }
rustfrp-bin = { version = "0.2.0", path = "../rustfrp-bin" }
tokio = { workspace = true, features = ["process", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true }
uuid.workspace = true
chrono.workspace = true
sha2 = "0.10"
anyhow.workspace = true
clap = { workspace = true }
dirs = "5"

# Unix signal handling
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Optional allocators
mimalloc = { version = "0.1", optional = true }
tikv-jemallocator = { version = "0.5", optional = true }

[dev-dependencies]
tempfile.workspace = true
rstest.workspace = true
serial_test.workspace = true
pretty_assertions.workspace = true
tokio-test.workspace = true
insta.workspace = true

[lib]
name = "rustfrp_client"
path = "src/lib.rs"
