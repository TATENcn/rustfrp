[package]
name = "rustfrp-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RustFRP agent — optional frps wrapper for server-side config management and plugin runtime"

[dependencies]
rustfrp-common = { version = "0.1.0", path = "../../common" }
rustfrp-bin = { version = "0.1.0", path = "../../rustfrp-bin" }
tokio = { workspace = true, features = ["process", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
reqwest.workspace = true
toml.workspace = true
sha2 = "0.10"
chrono.workspace = true
dirs = "5"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "rustfrp-agent"
path = "src/main.rs"
