<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="blue">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>RustFRP Manager</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('rustfrp-ui-preferences')
          const value = raw ? JSON.parse(raw) : null
          const mode = value?.mode ?? 'system'
          const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.accent = value?.accent ?? 'blue'
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.accent = 'blue'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
